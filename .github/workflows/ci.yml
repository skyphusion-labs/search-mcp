name: ci

# PR + main gate (aviation-grade). Fork PRs run on GitHub-hosted runners without
# deploy secrets. Hosted Skyphusion Workers were retired 2026-11-24 (#156). A
# version tag no longer deploys Workers. Cut a SemVer tag and publish a GitHub
# Release to ship the npm package (publish-npm.yml).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-search-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm ci
      # The escrow restore-proof tests drive the real age binary. Without it they would
      # SKIP, and a suite that silently skips in CI is indistinguishable from one that
      # passes. ESCROW_REQUIRE_AGE makes the skip path a hard failure here, so the skip
      # stays a local-dev convenience and can never quietly become the CI result.
      - name: Install age (escrow restore-proof tests)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version
      - run: npm run typecheck
      - run: npm test
        env:
          ESCROW_REQUIRE_AGE: "1"
